spring.datasource.url=jdbc:h2:file:./data/comunicaciones;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
app.auth.issuer=${COGNITO_ISSUER:http://localhost:9999/unconfigured}
app.auth.client-id=${COGNITO_CLIENT_ID:unconfigured}
app.auth.base-url=${MS_AUTH_URL:http://localhost:8081}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
