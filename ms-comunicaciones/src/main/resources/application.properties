spring.application.name=ms-comunicaciones
spring.profiles.default=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8084}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.liquibase.database-change-log-table=comunicaciones_databasechangelog
spring.liquibase.database-change-log-lock-table=comunicaciones_databasechangeloglock
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
