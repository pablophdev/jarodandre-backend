spring.application.name=ms-pedidos
spring.profiles.default=mysql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8083}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.liquibase.database-change-log-table=ventas_databasechangelog
spring.liquibase.database-change-log-lock-table=ventas_databasechangeloglock
app.catalogo.internal-token=${CATALOGO_INTERNAL_TOKEN:}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
