spring.datasource.url=jdbc:h2:file:./data/ventas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
app.auth.issuer=${COGNITO_ISSUER:}
app.auth.client-id=${COGNITO_CLIENT_ID:}
app.auth.url=${MS_AUTH_URL:http://localhost:8081}
app.catalogo.url=${MS_CATALOGO_URL:http://localhost:8082}
app.catalogo.modo=${CATALOGO_MODO:publico-local}
app.pago.simulado=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
