spring.application.name=ms-catalogo
spring.profiles.default=mysql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8082}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.data.web.pageable.max-page-size=100
app.catalogo.internal-token=${CATALOGO_INTERNAL_TOKEN:}
app.media.storage=${MEDIA_STORAGE:local}
app.media.bucket=${MEDIA_BUCKET:}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.liquibase.database-change-log-table=catalogo_databasechangelog
spring.liquibase.database-change-log-lock-table=catalogo_databasechangeloglock
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.pedidos.url=${MS_PEDIDOS_URL:http://localhost:8083}
